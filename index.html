<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teachable Machine Image Model Dashboard</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 8px;
            background: linear-gradient(to right, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .btn-start {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
            width: 100%;
            margin-bottom: 25px;
        }

        .btn-start:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.4);
        }

        .btn-start:active {
            transform: translateY(0);
        }

        #webcam-container {
            margin: 20px auto;
            border-radius: 16px;
            overflow: hidden;
            width: 250px;
            height: 250px;
            border: 3px solid var(--card-border);
            background: rgba(0,0,0,0.2);
            display: none; /* ซ่อนไว้ก่อนกดเริ่ม */
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }

        #webcam-container canvas {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover;
        }

        #label-container {
            margin-top: 25px;
            text-align: left;
        }

        /* สไตล์ของชิ้นส่วนแสดงผลความน่าจะเป็น */
        .prediction-row {
            margin-bottom: 16px;
        }

        .label-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
            margin-bottom: 6px;
            font-weight: 400;
        }

        .progress-bar-bg {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            height: 10px;
            width: 100%;
            overflow: hidden;
        }

        .progress-bar-fill {
            background: linear-gradient(90deg, #6366f1, #3b82f6);
            height: 100%;
            width: 0%;
            border-radius: 8px;
            transition: width 0.5s ease-out; /* เพิ่มแอนิเมชันตอนอัปเดต */
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Teachable Machine</h1>
        <div class="subtitle">AI Image Classification Dashboard</div>
        
        <button type="button" class="btn-start" id="start-btn" onclick="init()">Start Camera</button>
        
        <div id="webcam-container"></div>
        <div id="label-container"></div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    
    <script type="text/javascript">
        const URL = "https://teachablemachine.withgoogle.com/models/hYNfqoT84/";
        let model, webcam, labelContainer, maxPredictions;
        let timerInterval;

        async function init() {
            // ซ่อนปุ่มเริ่มหลังจากกดเพื่อไม่ให้กดซ้ำ
            document.getElementById("start-btn").style.display = "none";
            
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            // โหลด Model
            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            // ตั้งค่า Webcam (ปรับขนาดให้ใหญ่ขึ้นเล็กน้อยเป็น 250x250 ให้เข้ากับดีไซน์)
            const flip = true; 
            webcam = new tmImage.Webcam(250, 250, flip); 
            await webcam.setup(); 
            await webcam.play();
            
            // แสดงผลกล่องเว็บแคม
            const webcamContainer = document.getElementById("webcam-container");
            webcamContainer.style.display = "flex";
            webcamContainer.appendChild(webcam.canvas);

            // สร้างโครงสร้าง UI สำหรับแสดงผลลัพธ์ (Label + Progress Bar)
            labelContainer = document.getElementById("label-container");
            for (let i = 0; i < maxPredictions; i++) {
                const row = document.createElement("div");
                row.className = "prediction-row";
                row.innerHTML = `
                    <div class="label-text">
                        <span class="class-name">Loading...</span>
                        <span class="class-percentage">0%</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill"></div>
                    </div>
                `;
                labelContainer.appendChild(row);
            }

            // เริ่มต้นการลูปอัปเดตภาพของเว็บแคม (เพื่อให้ภาพเคลื่อนไหวลื่นไหลลื่นปกติ)
            window.requestAnimationFrame(webcamLoop);

            // ⚡ ส่วนสำคัญ: สั่งให้ฟังก์ชันทำนายผล (predict) ทำงานทุกๆ 3 วินาที (3000 มิลลิวินาที)
            timerInterval = setInterval(predict, 3000);
            
            // เรียกครั้งแรกทันทีเพื่อให้หน้าจอไม่ว่างเปล่าตอนเริ่ม
            predict();
        }

        // ฟังก์ชันนี้ทำหน้าที่อัปเดตเฟรมของกล้องให้เคลื่อนไหวตลอดเวลา (Real-time)
        async function webcamLoop() {
            webcam.update(); 
            window.requestAnimationFrame(webcamLoop);
        }

        // ฟังก์ชันทำนายผลที่จะถูกเรียกใช้งานทุกๆ 3 วินาที
        async function predict() {
            if (!model || !webcam) return;

            const prediction = await model.predict(webcam.canvas);
            const rows = labelContainer.getElementsByClassName("prediction-row");

            for (let i = 0; i < maxPredictions; i++) {
                const className = prediction[i].className;
                const probability = prediction[i].probability;
                const percentage = (probability * 100).toFixed(0) + "%";

                // อัปเดตข้อความและเปอร์เซ็นต์
                rows[i].querySelector(".class-name").innerText = className;
                rows[i].querySelector(".class-percentage").innerText = percentage;

                // อัปเดตความยาวของ Progress Bar ให้ขยับตามค่าความน่าจะเป็น
                rows[i].querySelector(".progress-bar-fill").style.width = percentage;
            }
        }
    </script>
</body>
</html>
