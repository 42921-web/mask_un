<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teachable Machine Image Model Dashboard</title>
    <!-- Google Fonts (คงเดิมตามบรีฟ ไม่มีการเปลี่ยนแบบอักษร) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* พาเลทเฉดสีชมพูแบบมีมิติ */
            --primary-color: #ec4899;           
            --primary-hover: #db2777;           
            --bg-gradient: linear-gradient(135deg, #1e0b14 0%, #311024 100%); 
            --card-bg: rgba(255, 241, 248, 0.06); 
            --card-border: rgba(236, 72, 153, 0.2); 
            --text-main: #fdf2f8;               
            --text-muted: #f472b6;              
            --progress-bar-bg: rgba(236, 72, 153, 0.15); 
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 8px;
            background: linear-gradient(to right, #f472b6, #db2777);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        /* เพิ่ม UI ตัวนับเวลาถอยหลัง 3 วินาที */
        .timer-badge {
            display: inline-block;
            background: rgba(236, 72, 153, 0.2);
            border: 1px solid rgba(236, 72, 153, 0.3);
            color: #fce7f3;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            font-weight: 600;
            display: none; /* ซ่อนไว้ตอนแรก */
        }

        .btn-start {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(236, 72, 153, 0.3);
            width: 100%;
            margin-bottom: 25px;
        }

        .btn-start:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(236, 72, 153, 0.5);
        }

        #webcam-container {
            margin: 20px auto;
            border-radius: 16px;
            overflow: hidden;
            width: 250px;
            height: 250px;
            border: 3px solid var(--card-border);
            background: rgba(0,0,0,0.3);
            display: none;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        #webcam-container canvas {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover;
        }

        #label-container {
            margin-top: 25px;
            text-align: left;
        }

        .prediction-row {
            margin-bottom: 16px;
        }

        .label-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
            margin-bottom: 6px;
            font-weight: 400;
        }

        .progress-bar-bg {
            background: var(--progress-bar-bg);
            border-radius: 8px;
            height: 10px;
            width: 100%;
            overflow: hidden;
        }

        .progress-bar-fill {
            background: linear-gradient(90deg, #f472b6, #ec4899, #be185d);
            height: 100%;
            width: 0%;
            border-radius: 8px;
            transition: width 0.4s ease-out; /* ความเร็วแอนิเมชันตอนแถบขยับ */
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Teachable Machine</h1>
        <div class="subtitle">AI Image Classification Dashboard</div>
        
        <!-- ป้ายแสดงสถานะการนับถอยหลังทุกๆ 3 วินาที -->
        <div id="timer-status" class="timer-badge">Next processing in: 3.0s</div>
        
        <button type="button" class="btn-start" id="start-btn" onclick="init()">Start Camera</button>
        
        <div id="webcam-container"></div>
        <div id="label-container"></div>
    </div>

    <!-- Scripts (Teachable Machine / TensorFlow) -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    
    <script type="text/javascript">
        const URL = "https://teachablemachine.withgoogle.com/models/hYNfqoT84/";
        let model, webcam, labelContainer, maxPredictions;
        
        // ตัวแปรสำหรับควบคุมเวลา
        let lastPredictTime = 0;
        const PROCESS_INTERVAL = 3000; // 3000 มิลลิวินาที = 3 วินาที

        async function init() {
            document.getElementById("start-btn").style.display = "none";
            document.getElementById("timer-status").style.display = "inline-block";
            
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            const flip = true; 
            webcam = new tmImage.Webcam(250, 250, flip); 
            await webcam.setup(); 
            await webcam.play();
            
            const webcamContainer = document.getElementById("webcam-container");
            webcamContainer.style.display = "flex";
            webcamContainer.appendChild(webcam.canvas);

            labelContainer = document.getElementById("label-container");
            for (let i = 0; i < maxPredictions; i++) {
                const row = document.createElement("div");
                row.className = "prediction-row";
                row.innerHTML = `
                    <div class="label-text">
                        <span class="class-name">Loading...</span>
                        <span class="class-percentage">0%</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill"></div>
                    </div>
                `;
                labelContainer.appendChild(row);
            }

            // บันทึกเวลาเริ่มต้นก้าวแรก
            lastPredictTime = performance.now();
            
            // สั่งประมวลผลทันทีในครั้งแรก
            await predict();

            // เริ่มต้นลูปหลักแบบ High-performance
            window.requestAnimationFrame(loop);
        }

        // ลูปหลักทำหน้าที่คุมสองส่วน: ภาพกล้องเคลื่อนไหวลื่นไหล และ ตรวจจับเวลาให้ประมวลผลทุกๆ 3 วินาที
        async function loop() {
            webcam.update(); // อัปเดตเฟรมภาพเว็บแคมให้ลื่นไหลสดใหม่เสมอ[cite: 1]
            
            const currentTime = performance.now();
            const elapsedTime = currentTime - lastPredictTime;
            
            // คำนวณเวลาที่เหลือเพื่อแสดงผลบนหน้าจอให้เห็นชัดเจน
            const timeLeft = Math.max(0, (PROCESS_INTERVAL - elapsedTime) / 1000);
            document.getElementById("timer-status").innerText = `Next processing in: ${timeLeft.toFixed(1)}s`;

            // ⚡ ส่วนสำคัญ: เมื่อเวลาผ่านไปครบหรือมากกว่า 3 วินาที (3000ms)
            if (elapsedTime >= PROCESS_INTERVAL) {
                console.log("=== ครบ 3 วินาที: ส่งภาพให้ AI ประมวลผล ===");
                await predict(); // เรียกฟังก์ชัน AI ทำนายผล
                lastPredictTime = currentTime; // รีเซ็ตเวลาเริ่มต้นรอบใหม่
            }

            window.requestAnimationFrame(loop);
        }

        // ฟังก์ชันส่งภาพไปประมวลผลผ่าน AI[cite: 1]
        async function predict() {
            if (!model || !webcam) return;

            const prediction = await model.predict(webcam.canvas); //[cite: 1]
            const rows = labelContainer.getElementsByClassName("prediction-row");

            for (let i = 0; i < maxPredictions; i++) {
                const className = prediction[i].className; //[cite: 1]
                const probability = prediction[i].probability; //[cite: 1]
                const percentage = (probability * 100).toFixed(0) + "%";

                rows[i].querySelector(".class-name").innerText = className;
                rows[i].querySelector(".class-percentage").innerText = percentage;
                rows[i].querySelector(".progress-bar-fill").style.width = percentage;
            }
        }
    </script>
</body>
</html>
