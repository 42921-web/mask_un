<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teachable Machine Image Model Dashboard</title>
    <!-- Google Fonts (คงเดิมตามบรีฟ ไม่มีการเปลี่ยนแบบอักษร) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* พาเลทเฉดสีชมพูแบบมีมิติ */
            --primary-color: #ec4899;           
            --primary-hover: #db2777;           
            --bg-gradient: linear-gradient(135deg, #1e0b14 0%, #311024 100%); 
            --card-bg: rgba(255, 241, 248, 0.06); 
            --card-border: rgba(236, 72, 153, 0.2); 
            --text-main: #fdf2f8;               
            --text-muted: #f472b6;              
            --progress-bar-bg: rgba(236, 72, 153, 0.15); 
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 8px;
            background: linear-gradient(to right, #f472b6, #db2777);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .btn-start {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(236, 72, 153, 0.3);
            width: 100%;
            margin-bottom: 25px;
        }

        .btn-start:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(236, 72, 153, 0.5);
        }

        #webcam-container {
            margin: 20px auto;
            border-radius: 16px;
            overflow: hidden;
            width: 250px;
            height: 250px;
            border: 3px solid var(--card-border);
            background: rgba(0,0,0,0.3);
            display: none;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        #webcam-container canvas {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover;
        }

        #label-container {
            margin-top: 25px;
            text-align: left;
        }

        .prediction-row {
            margin-bottom: 16px;
        }

        .label-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
            margin-bottom: 6px;
            font-weight: 400;
        }

        .progress-bar-bg {
            background: var(--progress-bar-bg);
            border-radius: 8px;
            height: 10px;
            width: 100%;
            overflow: hidden;
        }

        .progress-bar-fill {
            background: linear-gradient(90deg, #f472b6, #ec4899, #be185d);
            height: 100%;
            width: 0%;
            border-radius: 8px;
            transition: width 0.6s ease-in-out; /* ปรับการขยับของแถบสีชมพูให้นุ่มนวลขึ้น */
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Teachable Machine</h1>
        <div class="subtitle">AI Image Classification Dashboard</div>
        
        <button type="button" class="btn-start" id="start-btn" onclick="init()">Start Camera</button>
        
        <div id="webcam-container"></div>
        <div id="label-container"></div>
    </div>

    <!-- Scripts (Teachable Machine / TensorFlow)[cite: 2] -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    
    <script type="text/javascript">
        const URL = "https://teachablemachine.withgoogle.com/models/hYNfqoT84/";[cite: 2]
        let model, webcam, labelContainer, maxPredictions;

        async function init() {
            // ซ่อนปุ่มเมื่อกดเริ่มทำงาน
            document.getElementById("start-btn").style.display = "none";
            
            const modelURL = URL + "model.json";[cite: 2]
            const metadataURL = URL + "metadata.json";[cite: 2]

            // โหลดโมเดล[cite: 2]
            model = await tmImage.load(modelURL, metadataURL);[cite: 2]
            maxPredictions = model.getTotalClasses();[cite: 2]

            // ตั้งค่าเว็บแคม[cite: 2]
            const flip = true;[cite: 2]
            webcam = new tmImage.Webcam(250, 250, flip);[cite: 2]
            await webcam.setup();[cite: 2]
            await webcam.play();[cite: 2]
            
            // แสดงกล่องเว็บแคมบนหน้าจอ
            const webcamContainer = document.getElementById("webcam-container");
            webcamContainer.style.display = "flex";
            webcamContainer.appendChild(webcam.canvas);[cite: 2]

            // สร้างส่วนแสดงผล Progress Bar เฉดสีชมพู[cite: 2]
            labelContainer = document.getElementById("label-container");[cite: 2]
            for (let i = 0; i < maxPredictions; i++) {[cite: 2]
                const row = document.createElement("div");
                row.className = "prediction-row";
                row.innerHTML = `
                    <div class="label-text">
                        <span class="class-name">Ready...</span>
                        <span class="class-percentage">0%</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill"></div>
                    </div>
                `;
                labelContainer.appendChild(row);[cite: 2]
            }

            // เริ่มทำการลูปเพื่ออัปเดตภาพจากกล้องเว็บแคมให้ขยับได้ลื่นไหลปกติ
            window.requestAnimationFrame(webcamLoop);

            // ⚡ ส่วนสำคัญ: สั่งประมวลผลทำนายผลด้วย AI ทุกๆ 3 วินาที (3000 มิลลิวินาที)
            setInterval(predict, 3000);
            
            // สั่งทำนายครั้งแรกทันทีตอนเปิดกล้อง จะได้ไม่ต้องรอ 3 วินาทีแรก
            predict();
        }

        // ลูปนี้ทำหน้าที่เดียวคืออัปเดตภาพบนหน้าจอให้ขยับอยู่ตลอดเวลา
        async function webcamLoop() {
            webcam.update();[cite: 2]
            window.requestAnimationFrame(webcamLoop);
        }

        // ฟังก์ชันประมวลผลทำนายภาพ (ทำงานทุกๆ 3 วินาทีเท่านั้น)
        async function predict() {
            if (!model || !webcam) return;

            const prediction = await model.predict(webcam.canvas);[cite: 2]
            const rows = labelContainer.getElementsByClassName("prediction-row");

            for (let i = 0; i < maxPredictions; i++) {[cite: 2]
                const className = prediction[i].className;[cite: 2]
                const probability = prediction[i].probability;[cite: 2]
                const percentage = (probability * 100).toFixed(0) + "%";

                // อัปเดตข้อมูลบนหน้าจอ
                rows[i].querySelector(".class-name").innerText = className;
                rows[i].querySelector(".class-percentage").innerText = percentage;
                rows[i].querySelector(".progress-bar-fill").style.width = percentage;
            }
        }
    </script>
</body>
</html>
